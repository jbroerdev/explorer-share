name: Docker build and smoke test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and run integration tests
        run: docker compose build
      - name: Start container and wait for health check
        run: docker compose up -d --wait --wait-timeout 90
      - name: Check HTTP and filesystem
        run: |
          curl --fail --silent http://127.0.0.1:3000/api/session
          docker compose exec -T explorer node -e "const fs=require('node:fs');fs.accessSync('/Explorer/Users',fs.constants.W_OK);if(process.getuid()===0)process.exit(1)"
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
